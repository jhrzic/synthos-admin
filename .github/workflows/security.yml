# ---------------------------------------------------------------------------
# SynthOS Admin — verification and supply-chain controls.
#
# This repository had NO CI at all before this file. Everything here is
# native npm or a plain shell step: no paid service, no third-party action
# beyond GitHub's own checkout/setup-node/upload-artifact, and nothing that
# sends this repository's contents anywhere.
#
# What it deliberately does NOT do:
#   * It does not fail on the `qs` moderate advisory that exists today
#     (transitive, via express). Landing a red pipeline on day one teaches
#     people to ignore it. Moderate findings are printed; HIGH and CRITICAL
#     fail the build.
#   * It does not claim to be a secret scanner in the GitHub Advanced
#     Security sense. It runs this repo's own secret-guard tests plus the
#     canonical scanner (scripts/secret-scan.mjs). Push protection is a
#     repository setting, not something a workflow can provide.
# ---------------------------------------------------------------------------
name: security

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, tests, production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` is the canonical install for this repo: package-lock.json is
      # the committed lockfile and the Dockerfile uses the same command.
      - name: Install (locked)
        run: npm ci

      - name: Typecheck
        run: npm run lint

      # Production build FIRST: several tests exercise the real bundle
      # (test/graceful-shutdown.test.ts boots dist/server.cjs and asserts it
      # exists, so a missing bundle can never read as a pass). The build must
      # succeed AND emit the two artifacts the runtime actually serves.
      - name: Production build
        run: npm run build

      - name: Verify build output exists
        run: |
          set -euo pipefail
          for f in dist/server.cjs dist/index.html; do
            test -s "$f" || { echo "::error::missing or empty build output: $f"; exit 1; }
          done
          echo "build outputs present:"
          ls -l dist/server.cjs dist/index.html

      # The FULL suite, against the real build. It includes the authorization,
      # execution-evidence, redaction, client-bundle and bundle-boot guards,
      # so a security regression fails here rather than in a later review.
      - name: Test suite
        run: npx vitest run

      # Explicit, separately reported: the client bundle carries no secret.
      - name: Client bundle secret guard (post-build)
        run: npx vitest run test/client-bundle-secrets.test.ts

  dependencies:
    name: dependency advisories + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (locked)
        run: npm ci

      # Two passes, on purpose. Production dependencies are what ship, so
      # they are the gate; the dev-tree result is informational because a
      # build-tool advisory is not a runtime exposure.
      - name: Advisories — production dependencies (gate on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Advisories — full tree (informational)
        run: npm audit || true

      # Native npm, no extra dependency. CycloneDX is the format most
      # downstream tooling reads.
      - name: Generate SBOM
        run: |
          set -euo pipefail
          mkdir -p sbom
          npm sbom --sbom-format cyclonedx --omit=dev > sbom/sbom-production.cdx.json
          npm sbom --sbom-format cyclonedx > sbom/sbom-full.cdx.json
          node -e "const s=require('./sbom/sbom-production.cdx.json');console.log('production components:',(s.components||[]).length)"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  secrets:
    name: secret shape scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Repo secret-guard tests
        run: npx vitest run test/client-bundle-secrets.test.ts test/redaction.test.ts test/model-credential-authority.test.ts test/secret-scan.test.ts

      # THE canonical scanner (scripts/secret-scan.mjs) over every TRACKED
      # file — the single CI authority. It fails on any credential-shaped value
      # that is not recognisably synthetic (and judges PEM keys by their body),
      # while listing the repository's deliberate test vectors as SYNTHETIC.
      # It never scans a developer's local .env (gitignored, never tracked).
      - name: Canonical secret scan (tracked files)
        run: node scripts/secret-scan.mjs --all
